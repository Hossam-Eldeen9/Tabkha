<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Tabkha | Coming Soon</title>
    
    <link rel="icon" type="image/png" href="Favicon for the website.ico">
    
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css">
    
    <style>
        :root {
            --primary-blue: #00227b; 
            --accent-cyan: #00a0e3;   
            --bg-color: #000000; 
            --text-white: #ffffff;
            --glass-bg: rgba(255, 255, 255, 0.1);
        }

        body, html {
            height: 100%;
            margin: 0;
            font-family: 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            background-color: var(--bg-color);
            color: var(--text-white);
            text-align: center;
            overflow-x: hidden;
        }

        .container {
            padding: 40px 20px;
            width: 100%;
            max-width: 1000px;
            box-sizing: border-box;
        }

        .logo {
            width: 70%;
            max-width: 250px; 
            height: auto;
            margin-bottom: 30px;
            animation: fadeIn 1.5s ease-out;
        }

        h1 {
            font-size: 1.8rem; 
            font-weight: 300;
            letter-spacing: 6px;
            text-transform: uppercase;
            margin-bottom: 10px;
        }

        p {
            font-size: 1.1rem;
            color: var(--accent-cyan);
            font-weight: 400;
            margin-bottom: 60px;
            letter-spacing: 1.5px;
            font-style: italic;
        }

        /* Fixed Button Layout */
        .button-group {
            display: flex;
            justify-content: center;
            align-items: center;
            gap: 20px;
            flex-wrap: nowrap; /* Forces them into a row on desktop */
            width: 100%;
        }

        .btn {
            display: inline-flex;
            align-items: center;
            justify-content: center;
            border-radius: 10px;
            text-decoration: none;
            font-size: 0.9rem;
            font-weight: 600;
            transition: all 0.3s ease;
            border: 1px solid rgba(255, 255, 255, 0.15);
            color: var(--text-white);
            background: var(--glass-bg);
            height: 55px;
            white-space: nowrap;
        }

        .btn i {
            margin-right: 12px;
            font-size: 1.2rem;
        }

        /* Middle Main Button - The Widest */
        .btn-main {
            flex: 2; /* Takes up more space */
            max-width: 350px;
            background-color: var(--primary-blue);
            border: none;
            font-size: 1.1rem;
            order: 2;
        }

        /* Side Buttons */
        .btn-side {
            flex: 1; /* Smashed smaller than the middle */
            max-width: 240px;
        }

        .btn-side:first-child { order: 1; }
        .btn-side:last-child { order: 3; }

        /* Hover Effects */
        .btn:hover {
            transform: translateY(-3px);
            background-color: rgba(255, 255, 255, 0.2);
            border-color: var(--accent-cyan);
        }

        .btn-main:hover {
            background-color: #0033bb;
            box-shadow: 0 8px 25px rgba(0, 34, 123, 0.5);
        }

        footer {
            margin-top: 60px;
            font-size: 0.8rem;
            color: #666;
            letter-spacing: 1px;
        }

        @keyframes fadeIn {
            from { opacity: 0; transform: translateY(10px); }
            to { opacity: 1; transform: translateY(0); }
        }

        /* Mobile Fix: Stack them properly */
        @media (max-width: 800px) {
            .button-group {
                flex-direction: column;
                gap: 15px;
            }
            .btn {
                width: 100%;
                max-width: 320px;
            }
            .btn-main {
                order: -1; /* Request Access stays on top on mobile */
            }
        }
    </style>
</head>
<body>

    <div class="container">
        <img src="Tabkha's Logo for the website.png" alt="Tabkha Logo" class="logo">
        
        <h1>Coming Soon</h1>
        <p>Get ready to let the magic begin...</p>

        <div class="button-group">
            <a href="#" class="btn btn-side">
                <i class="fab fa-apple"></i> iOS Beta
            </a>
            
            <a href="#" class="btn btn-main">Request Access</a>
            
            <a href="#" class="btn btn-side">
                <i class="fab fa-android"></i> Android Alpha
            </a>
        </div>

        <footer>
            &copy; 2026 Tawwarly for Technical Consultancy
        </footer>
    </div>

</body>
</html>
