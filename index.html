<!DOCTYPE html>
<html lang="en">
<head>
    <script async src="https://www.googletagmanager.com/gtag/js?id=G-VDTCLJNGN9"></script>
    <script>
      window.dataLayer = window.dataLayer || [];
      function gtag(){dataLayer.push(arguments);}
      gtag('js', new Date());
      gtag('config', 'G-VDTCLJNGN9');
    </script>

    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Tabkha | Home</title>
    
    <link rel="icon" type="image/png" href="Tabkha Favicon2.ico">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.2/css/all.min.css">
    <link href="https://fonts.googleapis.com/css2?family=Cairo:wght@400;700&display=swap" rel="stylesheet">
    
    <style>
        :root {
            --primary-blue: #00227b; --accent-cyan: #00a0e3;   
            --bg-color: #000000; --text-white: #ffffff;
            --glass-bg: rgba(255, 255, 255, 0.1);
        }
        body, html {
            height: 100vh; margin: 0; padding: 0;
            font-family: 'Segoe UI', sans-serif; background-color: var(--bg-color);
            color: var(--text-white); display: flex; flex-direction: column;
            overflow: hidden; 
        }
        .lang-switch { position: absolute; top: 20px; right: 20px; z-index: 100; }
        .lang-btn {
            background: var(--glass-bg); border: 1px solid rgba(255, 255, 255, 0.15);
            color: var(--text-white); padding: 8px 15px; border-radius: 20px;
            cursor: pointer; font-family: 'Cairo', sans-serif; transition: 0.3s;
        }
        .main-content { flex: 1; display: flex; flex-direction: column; justify-content: center; align-items: center; padding: 10px; }
        .container { width: 100%; max-width: 900px; text-align: center; display: flex; flex-direction: column; align-items: center; }
        .logo { width: 60%; max-width: 200px; animation: logoZoom 3s ease-out forwards; }
        
        @keyframes logoZoom {
            0% { opacity: 0; transform: translateX(-5px) scale(0); }
            100% { opacity: 1; transform: translateX(-5px) scale(1); }
        }

        .divider { height: 1px; width: 0; background-color: var(--accent-cyan); margin: 10px auto; animation: expandDivider 1s ease-out forwards 2.5s; }
        @keyframes expandDivider { to { width: 50px; } }
        
        h1, .subtitle { opacity: 0; animation: fadeIn 1s ease-out forwards 3s; }
        h1 { font-size: 1.1rem; font-weight: 300; letter-spacing: 4px; text-transform: uppercase; margin: 5px 0; }
        .subtitle { font-size: 0.9rem; color: var(--accent-cyan); margin-bottom: 20px; font-style: italic; }
        @keyframes fadeIn { to { opacity: 1; } }
        
        .button-group { display: grid; grid-template-columns: 1fr 1.2fr 1fr; gap: 12px; width: 100%; max-width: 800px; }
        .btn {
            opacity: 0; display: flex; align-items: center; justify-content: center;
            border-radius: 50px; text-decoration: none; border: 1px solid rgba(255, 255, 255, 0.15);
            color: var(--text-white); background: var(--glass-bg); height: 55px; padding: 0 20px;
            animation: fadeInUp 0.8s ease-out forwards;
        }
        .btn-ios { animation-delay: 3.2s; } .btn-main { animation-delay: 3.4s; } .btn-android { animation-delay: 3.6s; }
        @keyframes fadeInUp { from { opacity: 0; transform: translateY(15px); } to { opacity: 1; transform: translateY(0); } }
        
        .btn-text-wrapper { display: flex; flex-direction: column; align-items: center; text-align: center; line-height: 1.2; }
        .btn-label-top { font-size: 0.8rem; font-weight: 700; display: block; }
        .btn-label-bottom { font-size: 0.6rem; opacity: 0.7; font-weight: 400; display: block; }

        .btn-main { background-color: var(--primary-blue); border: none; position: relative; overflow: hidden; animation: fadeInUp 0.8s forwards, buttonPulse 4s infinite 4.2s; }
        .btn-main::after { content: ''; position: absolute; top: -50%; left: -60%; width: 20%; height: 200%; background: rgba(255, 255, 255, 0.4); transform: rotate(30deg); animation: shiningEffect 3s infinite; animation-delay: 5s; }

        @keyframes shiningEffect { 0% { left: -60%; } 20% { left: 120%; } 100% { left: 120%; } }
        @keyframes buttonPulse { 0%, 100% { transform: scale(1); } 50% { transform: scale(1.05); background-color: #0033bb; } }
        
        [dir="rtl"] .btn i { margin-left: 10px; } [dir="ltr"] .btn i { margin-right: 10px; }
        .btn i { font-size: 1.1rem; }

        .social-links { display: flex; gap: 25px; justify-content: center; margin-top: 25px; opacity: 0; animation: fadeIn 1s ease-out forwards 3.8s; }
        .social-links a { color: var(--text-white); font-size: 1.4rem; transition: 0.3s; opacity: 0.7; text-decoration: none; }
        .social-links a:hover { opacity: 1; transform: translateY(-3px); }

        /* FOOTER STYLING - Stealth Link */
        footer { padding: 15px 0; font-size: 0.7rem; text-align: center; width: 100%; }
        .stealth-link { color: #444; text-decoration: none; cursor: default; }
        .stealth-link:hover { color: #444; } /* No change on hover keeps it hidden */

        @media (max-width: 850px) { .button-group { grid-template-columns: 1fr; max-width: 250px; } .btn-main { order: -1; } .btn { height: 48px; } }
    </style>
</head>
<body id="body-tag" dir="ltr">
    <div class="lang-switch"><button class="lang-btn" onclick="toggleLanguage()" id="lang-toggle-btn">العربية</button></div>
    
    <div class="main-content">
        <div class="container">
            <img src="Tabkha's Logo for the website.png" alt="Tabkha Logo" class="logo">
            <div class="divider"></div>
            <h1 id="txt-title">Coming Soon</h1>
            <p class="subtitle" id="txt-subtitle">Get ready to let the magic begin...</p>
            
            <div class="button-group">
                <a href="https://testflight.apple.com/join/pUev9aFE" class="btn btn-ios" onclick="gtag('event', 'click_ios_beta');">
                    <i class="fab fa-apple"></i>
                    <div class="btn-text-wrapper">
                        <span class="btn-label-top" id="txt-ios-top">iOS Beta</span>
                        <span class="btn-label-bottom" id="txt-ios-bottom">(TestFlight)</span>
                    </div>
                </a>
                <a href="Request.html" class="btn btn-main" onclick="gtag('event', 'click_join_request');">
                    <div class="btn-text-wrapper">
                        <span class="btn-label-top" id="txt-main-btn" style="font-size: 0.95rem;">Join the Tabkhaweya</span>
                    </div>
                </a>
                <a href="https://tabkha4android.blob.core.windows.net/tabkha4androidalpha/Tabkha%20(Android%20Alpha).apk" class="btn btn-android" onclick="gtag('event', 'click_android_alpha');">
                    <i class="fab fa-android"></i>
                    <div class="btn-text-wrapper">
                        <span class="btn-label-top" id="txt-android-top">Android Alpha</span>
                        <span class="btn-label-bottom" id="txt-android-bottom">(Direct Download)</span>
                    </div>
                </a>
            </div>

            <div class="social-links">
                <a href="https://instagram.com/tabkha.top" target="_blank"><i class="fa-brands fa-instagram"></i></a>
                <a href="https://www.facebook.com/tabkha.top" target="_blank"><i class="fa-brands fa-facebook"></i></a>
                <a href="https://youtube.com/@tabkhatop" target="_blank"><i class="fa-brands fa-youtube"></i></a>
                <a href="https://tiktok.com/@tabkha.top" target="_blank"><i class="fa-brands fa-tiktok"></i></a>
                <a href="https://x.com/tabkha_top" target="_blank"><i class="fa-brands fa-x-twitter"></i></a>
            </div>
        </div>
    </div>

    <footer id="txt-footer">
        <a href="https://tawwarly.com/" target="_blank" class="stealth-link" id="footer-link-text">
            &copy; 2026 Tawwarly for Technical Consultancy
        </a>
    </footer>

    <script>
        function updateUI(lang) {
            const body = document.getElementById('body-tag');
            const btn = document.getElementById('lang-toggle-btn');
            const elements = {
                title: document.getElementById('txt-title'), subtitle: document.getElementById('txt-subtitle'),
                iosTop: document.getElementById('txt-ios-top'), iosBottom: document.getElementById('txt-ios-bottom'),
                mainBtn: document.getElementById('txt-main-btn'), androidTop: document.getElementById('txt-android-top'),
                androidBottom: document.getElementById('txt-android-bottom'), footer: document.getElementById('footer-link-text')
            };
            if (lang === 'ar') {
                body.dir = 'rtl'; body.style.fontFamily = "'Cairo', sans-serif"; btn.innerText = 'English';
                elements.title.innerText = 'قريباً جداً'; elements.subtitle.innerText = 'السحر على وشك أن يبدأ.....';
                elements.iosTop.innerText = 'نسخة iOS'; elements.iosBottom.innerText = '(TestFlight)';
                elements.mainBtn.innerText = 'انضم للطبخاوية'; elements.androidTop.innerText = 'نسخة أندرويد';
                elements.androidBottom.innerText = '(تحميل مباشر)'; elements.footer.innerHTML = '&copy; 2026 طوَرلي للاستشارات التقنية';
            } else {
                body.dir = 'ltr'; body.style.fontFamily = "'Segoe UI', sans-serif"; btn.innerText = 'العربية';
                elements.title.innerText = 'Coming Soon'; elements.subtitle.innerText = 'Get ready to let the magic begin...';
                elements.iosTop.innerText = 'iOS Beta'; elements.iosBottom.innerText = '(TestFlight)';
                elements.mainBtn.innerText = 'Join the Tabkhaweya'; elements.androidTop.innerText = 'Android Alpha';
                elements.androidBottom.innerText = '(Direct Download)'; elements.footer.innerHTML = '&copy; 2026 Tawwarly for Technical Consultancy';
            }
        }
        function toggleLanguage() {
            const currentLang = localStorage.getItem('selectedLang') === 'ar' ? 'en' : 'ar';
            localStorage.setItem('selectedLang', currentLang);
            gtag('event', 'change_language', { 'language': currentLang });
            updateUI(currentLang);
        }
        window.onload = function() { updateUI(localStorage.getItem('selectedLang') || 'en'); }
    </script>
</body>
</html>
