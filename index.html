<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Tabkha | Coming Soon</title>
    
    <link rel="icon" type="image/png" href="Favicon for the website.ico">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css">
    
    <style>
        :root {
            --primary-blue: #00227b; 
            --accent-cyan: #00a0e3;   
            --bg-color: #000000; 
            --text-white: #ffffff;
            --glass-bg: rgba(255, 255, 255, 0.1);
        }

        /* The 'Full Height' fix to prevent button/footer overlap */
        body, html {
            height: 100%;
            margin: 0;
            padding: 0;
            font-family: 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;
            background-color: var(--bg-color);
            color: var(--text-white);
            display: flex;
            flex-direction: column;
        }

        /* This pushes the footer to the bottom */
        .main-content {
            flex: 1;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            padding: 20px;
            box-sizing: border-box;
        }

        .container {
            width: 100%;
            max-width: 1100px;
            text-align: center;
            display: flex;
            flex-direction: column;
            align-items: center;
        }

        .logo {
            width: 70%;
            max-width: 280px; 
            height: auto;
            margin-bottom: 0;
        }

        /* The Blue Line */
        .divider {
            height: 1px;
            width: 60px;
            background-color: var(--accent-cyan);
            margin: 15px auto;
            opacity: 0.8;
        }

        h1 {
            font-size: 1.4rem; 
            font-weight: 300;
            letter-spacing: 4px; 
            text-transform: uppercase;
            margin: 10px 0 0 0; /* Tight top, No bottom margin */
        }

        .subtitle {
            font-size: 1.1rem;
            color: var(--accent-cyan);
            font-weight: 400;
            letter-spacing: 1px;
            margin: 2px 0 50px 0; /* Extremely tight gap to h1 */
            font-style: italic;
        }

        /* Responsive Grid for Buttons */
        .button-group {
            display: grid;
            grid-template-columns: 1fr 1.4fr 1fr; 
            gap: 20px;
            width: 100%;
            max-width: 950px;
            align-items: center;
        }

        .btn {
            display: flex;
            align-items: center;
            justify-content: center;
            border-radius: 12px;
            text-decoration: none;
            font-size: 0.85rem;
            font-weight: 600;
            transition: all 0.3s ease;
            border: 1px solid rgba(255, 255, 255, 0.15);
            color: var(--text-white);
            background: var(--glass-bg);
            height: 60px;
            padding: 0 15px;
            white-space: nowrap;
        }

        .btn i {
            margin-right: 12px;
            font-size: 1.2rem;
        }

        /* Primary Button Style */
        .btn-main {
            background-color: var(--primary-blue);
            font-size: 1.1rem;
            border: none;
            box-shadow: 0 4px 15px rgba(0, 34, 123, 0.3);
        }

        .btn:hover {
            transform: translateY(-3px);
            background-color: rgba(255, 255, 255, 0.15);
            border-color: var(--accent-cyan);
        }

        .btn-main:hover {
            background-color: #0033bb;
            box-shadow: 0 8px 25px rgba(0, 34, 123, 0.5);
        }

        footer {
            padding: 30px 0;
            font-size: 0.75rem;
            color: #444;
            text-align: center;
            letter-spacing: 1px;
        }

        /* Mobile View Fixes */
        @media (max-width: 850px) {
            .button-group {
                grid-template-columns: 1fr;
                gap: 15px;
                max-width: 320px;
            }
            .btn-main { order: -1; } /* Main button moves to top on mobile */
            .subtitle { margin-bottom: 30px; }
            h1 { font-size: 1.2rem; }
        }
    </style>
</head>
<body>

    <div class="main-content">
        <div class="container">
            <img src="Tabkha's Logo for the website.png" alt="Tabkha Logo" class="logo">
            
            <div class="divider"></div>
            
            <h1>Coming Soon</h1>
            <p class="subtitle">Get ready to let the magic begin...</p>

            <div class="button-group">
                <a href="#" class="btn">
                    <i class="fab fa-apple"></i> iOS Beta (TestFlight)
                </a>
                
                <a href="#" class="btn btn-main">Request Access</a>
                
                <a href="#" class="btn">
                    <i class="fab fa-android"></i> Android Alpha (Direct Download)
                </a>
            </div>
        </div>
    </div>

    <footer>
        &copy; 2026 Tawwarly for Technical Consultancy
    </footer>

</body>
</html>
