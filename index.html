<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Tabkha | Coming Soon</title>
    
    <link rel="icon" type="image/png" href="Favicon for the website.ico">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css">
    
    <style>
        :root {
            --primary-blue: #00227b; 
            --accent-cyan: #00a0e3;   
            --bg-color: #000000; 
            --text-white: #ffffff;
            --glass-bg: rgba(255, 255, 255, 0.1);
        }

        body, html {
            height: 100%;
            margin: 0;
            padding: 0;
            font-family: 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;
            background-color: var(--bg-color);
            color: var(--text-white);
            display: flex;
            flex-direction: column;
            overflow: hidden; /* Prevents scrolling */
        }

        .main-content {
            flex: 1;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            padding: 10px; /* Reduced padding */
            box-sizing: border-box;
        }

        .container {
            width: 100%;
            max-width: 900px; /* Slightly narrower for tighter feel */
            text-align: center;
            display: flex;
            flex-direction: column;
            align-items: center;
        }

        .logo {
            width: 60%; /* Slightly smaller logo */
            max-width: 240px; 
            height: auto;
            transform: translateX(-25px); 
            margin-bottom: -5px; /* Pulls divider closer */
        }

        .divider {
            height: 1px;
            width: 50px;
            background-color: var(--accent-cyan);
            margin: 10px auto; /* Tighter vertical space */
            opacity: 0.8;
        }

        h1 {
            font-size: 1.2rem; /* Scaled down */
            font-weight: 300;
            letter-spacing: 4px; 
            text-transform: uppercase;
            margin: 5px 0 0 0;
        }

        .subtitle {
            font-size: 0.95rem; /* Scaled down */
            color: var(--accent-cyan);
            margin: 2px 0 25px 0; /* Significantly reduced bottom margin */
            font-style: italic;
        }

        .button-group {
            display: grid;
            grid-template-columns: 1fr 1.2fr 1fr; /* Middle button still slightly wider */
            gap: 12px; /* Narrower gap */
            width: 100%;
            max-width: 800px;
            align-items: center;
        }

        .btn {
            display: flex;
            align-items: center;
            justify-content: center;
            border-radius: 50px; /* Much more rounded (pill shape) */
            text-decoration: none;
            font-size: 0.75rem; /* Smaller text */
            font-weight: 600;
            transition: all 0.3s ease;
            border: 1px solid rgba(255, 255, 255, 0.15);
            color: var(--text-white);
            background: var(--glass-bg);
            height: 45px; /* Shorter height */
            padding: 0 10px;
            white-space: nowrap;
        }

        .btn i { margin-right: 8px; font-size: 1rem; }

        .btn-main {
            background-color: var(--primary-blue);
            font-size: 0.9rem; /* Main action remains clear */
            border: none;
            box-shadow: 0 4px 15px rgba(0, 34, 123, 0.3);
        }

        .btn:hover { transform: translateY(-2px); background-color: rgba(255, 255, 255, 0.15); }

        footer {
            padding: 15px 0; /* Tighter footer */
            font-size: 0.7rem;
            color: #444;
            text-align: center;
            letter-spacing: 1px;
        }

        @media (max-width: 850px) {
            .button-group { grid-template-columns: 1fr; gap: 10px; max-width: 280px; }
            .btn-main { order: -1; }
            .logo { transform: translateX(0); width: 50%; }
            .subtitle { margin-bottom: 20px; }
            body { overflow-y: auto; } /* Allow scroll only on small mobile */
        }
    </style>
</head>
<body>
    <div class="main-content">
        <div class="container">
            <img src="Tabkha's Logo for the website.png" alt="Tabkha Logo" class="logo">
            <div class="divider"></div>
            <h1>Coming Soon</h1>
            <p class="subtitle">Get ready to let the magic begin...</p>
            <div class="button-group">
                <a href="https://testflight.apple.com/join/pUev9aFE" class="btn">
                    <i class="fab fa-apple"></i> iOS Beta
                </a>
                
                <a href="Request.html" class="btn btn-main">Request Access</a>
                
                <a href="https://tabkha4android.blob.core.windows.net/tabkha4androidalpha/Tabkha%20(Android%20Alpha).apk" class="btn">
                    <i class="fab fa-android"></i> Android Alpha
                </a>
            </div>
        </div>
    </div>
    <footer>
        &copy; 2026 Tawwarly for Technical Consultancy
    </footer>
</body>
</html>
