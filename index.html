<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Tabkha | Coming Soon</title>
    
    <link rel="icon" type="image/png" href="Favicon for the website.ico">
    
    <style>
        :root {
            --primary-blue: #00227b; 
            --accent-cyan: #00a0e3;   
            --bg-color: #000000; 
            --text-white: #ffffff;
        }

        body, html {
            height: 100%;
            margin: 0;
            font-family: 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            background-color: var(--pure-black);
            color: var(--text-white);
            text-align: center;
        }

        .container {
            padding: 20px;
            width: 90%;
            max-width: 800px;
        }

        .logo {
            width: 70%;
            max-width: 250px; 
            height: auto;
            margin-bottom: 25px;
            animation: fadeIn 1.5s ease-out;
        }

        h1 {
            font-size: 1.6rem; 
            font-weight: 300;
            letter-spacing: 5px;
            text-transform: uppercase;
            margin-bottom: 8px;
        }

        p {
            font-size: 1.1rem;
            color: var(--primary-orange);
            font-weight: 400;
            margin-bottom: 40px;
            letter-spacing: 1.5px;
            font-style: italic;
        }

        /* Button Layout */
        .button-group {
            display: flex;
            justify-content: center;
            align-items: center;
            gap: 15px;
            flex-wrap: wrap;
            margin-top: 20px;
        }

        .btn {
            padding: 12px 20px;
            border-radius: 8px;
            text-decoration: none;
            font-size: 0.85rem;
            font-weight: 600;
            transition: all 0.3s ease;
            border: 1px solid rgba(255, 255, 255, 0.1);
            color: var(--text-white);
            background: var(--glass-bg);
            cursor: pointer;
        }

        /* Middle Main Button */
        .btn-main {
            padding: 16px 40px;
            background-color: var(--primary-orange);
            color: var(--pure-black);
            font-size: 1rem;
            order: 2; /* Keeps it in the middle */
            border: none;
        }

        .btn-side {
            flex: 1;
            min-width: 180px;
        }

        .btn-side:first-child { order: 1; }
        .btn-side:last-child { order: 3; }

        .btn:hover {
            transform: translateY(-3px);
            background-color: rgba(255, 255, 255, 0.15);
        }

        .btn-main:hover {
            background-color: #ff8557;
            box-shadow: 0 0 20px rgba(255, 107, 53, 0.4);
        }

        footer {
            position: fixed;
            bottom: 30px;
            width: 100%;
            font-size: 0.8rem;
            color: var(--text-muted);
        }

        @keyframes fadeIn {
            from { opacity: 0; transform: translateY(10px); }
            to { opacity: 1; transform: translateY(0); }
        }

        @media (max-width: 600px) {
            .button-group { flex-direction: column; width: 100%; }
            .btn { width: 100%; order: unset !important; }
        }
    </style>
</head>
<body>

    <div class="container">
        <img src="Tabkha's Logo for the website.png" alt="Tabkha Logo" class="logo">
        
        <h1>Coming Soon</h1>
        <p>Get ready to let the magic begin...</p>

        <div class="button-group">
            <a href="#" class="btn btn-side">iOS Beta (TestFlight)</a>
            
            <a href="#" class="btn btn-main">Request Access</a>
            
            <a href="#" class="btn btn-side">Android Alpha (Direct Download)</a>
        </div>
    </div>

    <footer>
        &copy; 2026 Tawwarly for Technical Consultancy
    </footer>

</body>
</html>
