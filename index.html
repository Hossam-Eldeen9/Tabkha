<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Tabkha | Coming Soon</title>
    
    <link rel="icon" type="image/png" href="Favicon for the website.ico">
    
    <style>
        :root {
            --primary-blue: #00227b; 
            --accent-cyan: #00a0e3;   
            --bg-color: #000000; 
            --text-white: #ffffff;
        }

        body, html {
            height: 100%;
            margin: 0;
            font-family: 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            background-color: var(--pure-black); /* Set to Pure Black */
            color: var(--text-white);
            text-align: center;
            overflow: hidden;
        }

        .container {
            padding: 20px;
            width: 100%;
            max-width: 600px;
        }

        .logo {
            width: 78%;
            max-width: 280px; 
            height: auto;
            margin-bottom: 25px;
            animation: fadeIn 1.5s ease-out;
        }

        h1 {
            font-size: 1.6rem; 
            font-weight: 300;
            letter-spacing: 5px;
            text-transform: uppercase;
            margin-top: 20px;
            margin-bottom: 8px;
        }

        p {
            font-size: 1.1rem;
            color: var(--primary-orange);
            font-weight: 400;
            margin-bottom: 40px;
            letter-spacing: 1.5px;
            font-style: italic;
        }

        .divider {
            height: 2px;
            width: 40px;
            background-color: var(--primary-orange);
            margin: 0 auto;
        }

        footer {
            position: fixed;
            bottom: 30px;
            width: 100%;
            font-size: 0.8rem;
            color: var(--text-muted);
            letter-spacing: 1px;
        }

        @keyframes fadeIn {
            from { opacity: 0; transform: translateY(10px); }
            to { opacity: 1; transform: translateY(0); }
        }

        @media (max-width: 480px) {
            h1 { font-size: 1.3rem; }
            .logo { width: 65%; }
        }
    </style>
</head>
<body>

    <div class="container">
        <img src="Tabkha's Logo for the website.png" alt="Tabkha Logo" class="logo">
        
        <div class="divider"></div>
        
        <h1>Coming Soon</h1>
        <p>Get Ready to let the Magic begin....</p>
    </div>

    <footer>
        &copy; 2026 Tawwarly for Technical Consultancy
    </footer>

</body>
</html>
