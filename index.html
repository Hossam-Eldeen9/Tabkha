<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Tabkha | Coming Soon</title>
    
    <link rel="icon" type="image/png" href="Favicon for the website.ico">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css">
    
    <style>
        :root {
            --primary-blue: #00227b; 
            --accent-cyan: #00a0e3;   
            --bg-color: #000000; 
            --text-white: #ffffff;
            --glass-bg: rgba(255, 255, 255, 0.1);
        }

        body, html {
            height: 100%;
            margin: 0;
            font-family: 'Segoe UI', Roboto, sans-serif;
            background-color: var(--bg-color);
            color: var(--text-white);
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
        }

        .container {
            width: 100%;
            max-width: 900px; /* Increased to give buttons breathing room */
            padding: 20px;
            text-align: center;
            box-sizing: border-box;
        }

        .logo {
            width: 250px;
            height: auto;
            margin-bottom: 20px;
        }

        h1 {
            font-size: 1.8rem;
            letter-spacing: 5px;
            text-transform: uppercase;
            margin: 10px 0;
        }

        p {
            color: var(--accent-cyan);
            font-style: italic;
            margin-bottom: 50px;
        }

        /* Fixed Button Grid */
        .button-grid {
            display: grid;
            grid-template-columns: 1fr 1.5fr 1fr; /* Middle is 1.5x wider */
            gap: 15px;
            align-items: center;
            margin-bottom: 60px; /* Space for footer */
        }

        .btn {
            height: 55px;
            display: flex;
            align-items: center;
            justify-content: center;
            text-decoration: none;
            color: white;
            border-radius: 10px;
            font-weight: 600;
            font-size: 0.9rem;
            transition: 0.3s;
            white-space: nowrap;
            padding: 0 10px;
        }

        .btn i { margin-right: 10px; font-size: 1.1rem; }

        .btn-side {
            background: var(--glass-bg);
            border: 1px solid rgba(255,255,255,0.1);
        }

        .btn-main {
            background-color: var(--primary-blue);
            font-size: 1.1rem;
        }

        .btn:hover { transform: translateY(-3px); }
        .btn-main:hover { background-color: #0033bb; box-shadow: 0 5px 15px rgba(0,34,123,0.4); }

        footer {
            position: absolute;
            bottom: 30px;
            font-size: 0.8rem;
            color: #666;
        }

        /* Mobile View */
        @media (max-width: 700px) {
            .button-grid {
                grid-template-columns: 1fr;
                width: 100%;
                max-width: 320px;
                margin: 0 auto 60px auto;
            }
            .btn-main { order: -1; } /* Request Access on top */
        }
    </style>
</head>
<body>

    <div class="container">
        <img src="Tabkha's Logo for the website.png" alt="Tabkha Logo" class="logo">
        
        <h1>Coming Soon</h1>
        <p>Get ready to let the magic begin...</p>

        <div class="button-grid">
            <a href="#" class="btn btn-side">
                <i class="fab fa-apple"></i> iOS Beta (TestFlight)
            </a>
            
            <a href="#" class="btn btn-main">Request Access</a>
            
            <a href="#" class="btn btn-side">
                <i class="fab fa-android"></i> Android Alpha
            </a>
        </div>
    </div>

    <footer>
        &copy; 2026 Tawwarly for Technical Consultancy
    </footer>

</body>
</html>
