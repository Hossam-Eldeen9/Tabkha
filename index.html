<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Tabkha | Coming Soon</title>
    
    <link rel="icon" type="image/png" href="Favicon for the website.ico">
    
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css">
    
    <style>
        :root {
            --primary-blue: #00227b; 
            --accent-cyan: #00a0e3;   
            --bg-color: #000000; 
            --text-white: #ffffff;
            --glass-bg: rgba(255, 255, 255, 0.1);
        }

        body, html {
            height: 100%;
            margin: 0;
            font-family: 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            background-color: var(--bg-color);
            color: var(--text-white);
            text-align: center;
        }

        .container {
            padding: 20px;
            width: 90%;
            max-width: 900px;
        }

        .logo {
            width: 70%;
            max-width: 250px; 
            height: auto;
            margin-bottom: 25px;
            animation: fadeIn 1.5s ease-out;
        }

        h1 {
            font-size: 1.6rem; 
            font-weight: 300;
            letter-spacing: 5px;
            text-transform: uppercase;
            margin-bottom: 8px;
        }

        p {
            font-size: 1.1rem;
            color: var(--accent-cyan); /* Using your Cyan color */
            font-weight: 400;
            margin-bottom: 50px;
            letter-spacing: 1.5px;
            font-style: italic;
        }

        /* Button Layout */
        .button-group {
            display: flex;
            justify-content: center;
            align-items: center;
            gap: 15px;
            flex-wrap: wrap;
        }

        .btn {
            display: inline-flex;
            align-items: center;
            justify-content: center;
            border-radius: 10px;
            text-decoration: none;
            font-size: 0.85rem;
            font-weight: 600;
            transition: all 0.3s ease;
            border: 1px solid rgba(255, 255, 255, 0.1);
            color: var(--text-white);
            background: var(--glass-bg);
            cursor: pointer;
        }

        .btn i {
            margin-right: 10px;
            font-size: 1.2rem;
        }

        /* Middle Main Button - Widest */
        .btn-main {
            padding: 16px 50px;
            background-color: var(--primary-blue); /* Using your Blue color */
            border: none;
            font-size: 1rem;
            min-width: 280px;
            order: 2;
        }

        /* Side Buttons */
        .btn-side {
            padding: 12px 20px;
            min-width: 200px;
            flex: 1;
        }

        .btn-side:first-child { order: 1; }
        .btn-side:last-child { order: 3; }

        /* Hover Effects */
        .btn:hover {
            transform: translateY(-3px);
            background-color: rgba(255, 255, 255, 0.2);
        }

        .btn-main:hover {
            background-color: var(--accent-cyan);
            box-shadow: 0 5px 20px rgba(0, 160, 227, 0.4);
        }

        footer {
            position: fixed;
            bottom: 30px;
            width: 100%;
            font-size: 0.8rem;
            color: #666;
        }

        @keyframes fadeIn {
            from { opacity: 0; transform: translateY(10px); }
            to { opacity: 1; transform: translateY(0); }
        }

        @media (max-width: 768px) {
            .button-group { flex-direction: column; width: 100%; }
            .btn { width: 100%; max-width: 300px; order: unset !important; }
            .btn-main { order: -1 !important; } /* Request Access first on mobile */
        }
    </style>
</head>
<body>

    <div class="container">
        <img src="Tabkha's Logo for the website.png" alt="Tabkha Logo" class="logo">
        
        <h1>Coming Soon</h1>
        <p>Get ready to let the magic begin...</p>

        <div class="button-group">
            <a href="#" class="btn btn-side">
                <i class="fab fa-apple"></i> iOS Beta (TestFlight)
            </a>
            
            <a href="#" class="btn btn-main">Request Access</a>
            
            <a href="#" class="btn btn-side">
                <i class="fab fa-android"></i> Android Alpha
            </a>
        </div>
    </div>

    <footer>
        &copy; 2026 Tawwarly for Technical Consultancy
    </footer>

</body>
</html>
