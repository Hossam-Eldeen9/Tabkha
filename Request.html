<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Tabkha | Request Access</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css">
    <style>
        :root {
            --primary-blue: #00227b; 
            --accent-cyan: #00a0e3;   
            --bg-color: #000000; 
            --text-white: #ffffff;
            --glass-bg: rgba(255, 255, 255, 0.1);
        }

        body {
            background-color: var(--bg-color);
            color: var(--text-white);
            font-family: 'Segoe UI', sans-serif;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            margin: 0;
            padding: 20px;
            box-sizing: border-box;
        }

        .form-container {
            background: var(--glass-bg);
            padding: 40px;
            border-radius: 20px;
            border: 1px solid rgba(255, 255, 255, 0.1);
            width: 100%;
            max-width: 500px;
            text-align: center;
        }

        h2 { color: var(--accent-cyan); text-transform: uppercase; letter-spacing: 2px; margin-bottom: 10px; }
        p { font-size: 0.9rem; color: #888; margin-bottom: 30px; }

        .form-group { text-align: left; margin-bottom: 20px; }
        label { display: block; margin-bottom: 8px; font-size: 0.85rem; color: #ccc; }

        input, select, textarea {
            width: 100%;
            padding: 12px;
            border-radius: 8px;
            border: 1px solid #333;
            background: #111;
            color: white;
            box-sizing: border-box;
            font-size: 1rem;
        }

        input:focus, select:focus, textarea:focus {
            outline: none;
            border-color: var(--accent-cyan);
        }

        .submit-btn {
            background: var(--primary-blue);
            color: white;
            border: none;
            padding: 15px 30px;
            border-radius: 12px;
            font-weight: bold;
            font-size: 1rem;
            cursor: pointer;
            width: 100%;
            margin-top: 10px;
            transition: 0.3s;
        }

        .submit-btn:hover { background: #0033bb; transform: translateY(-2px); }

        .back-link { 
            display: inline-block; 
            margin-top: 25px; 
            color: #666; 
            text-decoration: none; 
            font-size: 0.85rem; 
            transition: color 0.3s;
        }

        .back-link:hover { color: var(--accent-cyan); }
    </style>
</head>
<body>

    <div class="form-container">
        <h2>Request Beta Access</h2>
        <p>Fill in your details to join the testing team.</p>

        <form action="https://formspree.io/f/mnjbaowd" method="POST">
            <div class="form-group">
                <label>Full Name</label>
                <input type="text" name="name" placeholder="Hossam Mahmoud" required>
            </div>

            <div style="display: flex; gap: 15px;">
                <div class="form-group" style="flex: 1;">
                    <label>Age</label>
                    <input type="number" name="age" required>
                </div>
                <div class="form-group" style="flex: 2;">
                    <label>Country</label>
                    <input type="text" name="country" required>
                </div>
            </div>

            <div class="form-group">
                <label>Email Address</label>
                <input type="email" name="email" placeholder="info@tawwarly.com" required>
            </div>

            <div class="form-group">
                <label>Device Type</label>
                <select name="device" required>
                    <option value="" disabled selected>Choose your device</option>
                    <option value="iOS">iOS (iPhone)</option>
                    <option value="Android">Android</option>
                </select>
            </div>

            <div class="form-group">
                <label>Reason for Interest</label>
                <textarea name="reason" rows="3" placeholder="I love cooking and want to try new recipes!"></textarea>
            </div>

            <button type="submit" class="submit-btn">Submit Request</button>
        </form>

        <a href="index.html" class="back-link"><i class="fas fa-arrow-left"></i> Back to Main Page</a>
    </div>

</body>
</html>
