<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Tabkha | Request Access</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css">
    <style>
        :root {
            --primary-blue: #00227b; 
            --accent-cyan: #00a0e3;   
            --bg-color: #000000; 
            --text-white: #ffffff;
            --glass-bg: rgba(255, 255, 255, 0.1);
        }

        body {
            background-color: var(--bg-color);
            color: var(--text-white);
            font-family: 'Segoe UI', sans-serif;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            margin: 0;
        }

        .form-container {
            background: var(--glass-bg);
            padding: 40px;
            border-radius: 20px;
            border: 1px solid rgba(255, 255, 255, 0.1);
            width: 90%;
            max-width: 500px;
            text-align: center;
        }

        h2 { color: var(--accent-cyan); text-transform: uppercase; letter-spacing: 2px; }

        .form-group { text-align: left; margin-bottom: 15px; }

        label { display: block; margin-bottom: 5px; font-size: 0.9rem; color: #ccc; }

        input, select, textarea {
            width: 100%;
            padding: 12px;
            border-radius: 8px;
            border: 1px solid #333;
            background: #111;
            color: white;
            box-sizing: border-box;
        }

        .submit-btn {
            background: var(--primary-blue);
            color: white;
            border: none;
            padding: 15px 30px;
            border-radius: 12px;
            font-weight: bold;
            cursor: pointer;
            width: 100%;
            margin-top: 20px;
            transition: 0.3s;
        }

        .submit-btn:hover { background: #0033bb; transform: translateY(-2px); }

        .back-link { display: block; margin-top: 20px; color: #666; text-decoration: none; font-size: 0.8rem; }
    </style>
</head>
<body>

    <div class="form-container">
        <h2>Beta Access Request</h2>
        <p>Join the Tabkha inner circle.</p>

        <form action="https://formspree.io/f/mnjbaowd" method="POST">
            <div class="form-group">
                <label>Full Name</label>
                <input type="text" name="name" required>
            </div>

            <div class="form-row" style="display: flex; gap: 10px;">
                <div class="form-group" style="flex: 1;">
                    <label>Age</label>
                    <input type="number" name="age" required>
                </div>
                <div class="form-group" style="flex: 2;">
                    <label>Country</label>
                    <input type="text" name="country" required>
                </div>
            </div>

            <div class="form-group">
                <label>Email Address</label>
                <input type="email" name="_replyto" required>
            </div>

            <div class="form-group">
                <label>Device Type</label>
                <select name="device" required>
                    <option value="" disabled selected>Select your device</option>
                    <option value="iOS">iOS (iPhone)</option>
                    <option value="Android">Android</option>
                </select>
            </div>

            <div class="form-group">
                <label>Reason for Interest</label>
                <textarea name="message" rows="3"></textarea>
            </div>

            <button type="submit" class="submit-btn">Send Request</button>
        </form>

        <a href="index.html" class="back-link">← Back to Main Page</a>
    </div>

</body>
</html>
